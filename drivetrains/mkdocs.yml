site_name: "Subsystems Wiki: Drivetrains"
site_description: Non-season-specific engineering guide to VEX IQ drivetrains.
theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.footnote.tooltips
    - header.autohide
    - search.highlight

nav:
  - Overview: index.md
  - Core Concepts:
      - Gear Ratios (Speed vs. Torque): gear-ratios.md
      - Wheels & Omni Configurations: wheels-and-omni.md
      - Friction Reduction & Bracing: friction-and-bracing.md
  - Drivetrain Types:
      - Standard Tank Drive: tank-drive.md
