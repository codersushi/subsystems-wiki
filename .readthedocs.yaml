version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  jobs:
    post_checkout:
      - git clone --depth 1 --filter=blob:none --sparse https://x-access-token:${SUBWIKI_MD_TOKEN}@github.com/codersushi/subwiki-hidden.git temp-docs
      - git -C temp-docs sparse-checkout set drivetrains
      - mv temp-docs/drivetrains drivetrains/docs
      - rm -rf temp-docs

mkdocs:
  configuration: drivetrains/mkdocs.yml

python:
  install:
    - requirements: drivetrains/requirements.txt
